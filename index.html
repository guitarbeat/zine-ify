<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="description" content="Convert PDFs into printable 8-page or 16-page zine layouts with ease" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' ws: http://localhost:8001 http://127.0.0.1:8001 blob:;">
    <title>Zine-ify PDF Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Fonts: Inter (UI), Outfit (Display), Permanent Marker (Zine Vibe) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;900&family=Permanent+Marker&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
</head>

<body class="antialiased min-h-screen py-6 px-4 selection:bg-primary-vibrant selection:text-white">
    <!-- Animated background mesh is handled in index.css -->
    <div class="max-w-4xl mx-auto space-y-8 relative z-10">
        
        <header class="text-center flex flex-col items-center justify-center gap-2 transform -rotate-1 animate-float">
            <h1 class="text-5xl md:text-7xl font-display font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-primary-vibrant to-secondary-cyan drop-shadow-[0_0_15px_rgba(255,0,255,0.5)]">
                Zine-ify
            </h1>
            <p class="text-white font-inter font-bold text-xs md:text-sm bg-black/40 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/10 uppercase tracking-widest shadow-[0_0_10px_rgba(0,255,255,0.2)]">
                Premium Zine Generation
            </p>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-[320px_1fr] gap-6 md:gap-8 items-start">
            <!-- Left Column: Controls & Upload -->
            <div class="space-y-6 md:sticky md:top-6 relative z-20">
                <div id="upload-zone"
                    class="upload-box p-6 flex flex-col items-center justify-center text-center cursor-pointer min-h-[160px] group focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-vibrant rounded-2xl"
                    role="button" tabindex="0" aria-label="Upload PDF document" title="Upload PDF (Ctrl+O)" aria-keyshortcuts="Control+O">
                    <div class="w-14 h-14 rounded-full bg-black/30 border border-white/10 flex items-center justify-center mb-4 group-hover:bg-primary-vibrant/20 group-hover:scale-110 transition-all duration-300">
                        <span class="material-symbols-outlined text-4xl text-gray-300 group-hover:text-white transition-colors" aria-hidden="true">cloud_upload</span>
                    </div>
                    <h2 class="text-lg font-display font-bold text-white mb-1 tracking-wide">DROP PDFS HERE</h2>
                    <p id="upload-status" class="text-xs font-semibold uppercase mt-2 bg-black/50 text-gray-300 px-3 py-1 rounded-full border border-white/10 backdrop-blur-sm" aria-live="polite">
                        Add PDFs to preview
                    </p>
                    <input type="file" id="pdf-upload" class="hidden" accept="application/pdf" multiple>
                </div>

                <!-- Uploaded Files List -->
                <div id="uploaded-files-list" class="mt-4 glass-panel p-3">
                    <p class="text-xs text-center text-gray-400 font-medium">No files uploaded yet</p>
                </div>

                <div id="settings-group" class="settings-panel p-6 space-y-5 rounded-2xl flex flex-col">
                    <h3 class="text-xl font-display font-bold uppercase border-b border-white/10 pb-3 mb-1 text-white flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary-vibrant">tune</span> Settings
                    </h3>

                    <div class="grid grid-cols-1 gap-5">
                        <div class="flex flex-col gap-1.5">
                            <label for="paper-size-select" class="text-xs font-semibold uppercase text-gray-400 tracking-wider">Paper Size</label>
                            <select id="paper-size-select" class="w-full text-sm p-2.5 font-medium">
                                <!-- Populated by JS -->
                            </select>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label for="orientation-select" class="text-xs font-semibold uppercase text-gray-400 tracking-wider">Orientation</label>
                            <select id="orientation-select" class="w-full text-sm p-2.5 font-medium">
                                <option value="landscape">Landscape</option>
                                <option value="portrait">Portrait</option>
                            </select>
                        </div>
                    </div>

                    <!-- Grid Size Inputs -->
                    <div class="pt-5 border-t border-white/10 mt-2" role="group" aria-labelledby="grid-layout-label">
                        <label id="grid-layout-label" class="text-xs font-semibold uppercase text-gray-400 tracking-wider mb-2 block">Grid Layout</label>
                        <div class="flex gap-3 items-center justify-center bg-black/20 p-2 border border-white/5 rounded-xl">
                            <input type="number" id="grid-rows" min="1" max="10" value="2" aria-label="Grid Rows"
                                class="w-16 text-lg p-2 text-center font-bold font-display rounded-lg !bg-transparent !border-none !shadow-none focus:!ring-1 focus:!ring-secondary-cyan">
                            <span class="text-xl font-display font-light text-gray-500" aria-hidden="true">×</span>
                            <input type="number" id="grid-cols" min="1" max="10" value="4" aria-label="Grid Columns"
                                class="w-16 text-lg p-2 text-center font-bold font-display rounded-lg !bg-transparent !border-none !shadow-none focus:!ring-1 focus:!ring-secondary-cyan">
                        </div>
                        <span id="grid-total" class="text-xs mt-3 block text-center font-medium text-gray-500 tracking-wider">(8 PAGES TOTAL)</span>
                    </div>

                    <!-- Page Numbers Toggle -->
                    <div class="pt-5 border-t border-white/10 mt-2">
                        <div class="flex items-center gap-3">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="show-page-numbers" checked class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-vibrant shadow-[0_0_10px_rgba(255,0,255,0.2)_inset]"></div>
                                <span class="ml-3 text-sm font-semibold uppercase text-gray-300 tracking-wide">Show Page #</span>
                            </label>
                        </div>
                    </div>

                </div>

                <div id="action-buttons" class="space-y-4 hidden flex-col">
                    <button id="exportPdfBtn"
                        class="action-button w-full py-4 flex items-center justify-center gap-2"
                        title="Download PDF (Ctrl+S)" aria-keyshortcuts="Control+S">
                        <span class="material-symbols-outlined" aria-hidden="true">file_download</span>
                        DOWNLOAD PDF
                    </button>
                    <button id="printBtn"
                        class="action-button w-full py-4 flex items-center justify-center gap-2"
                        title="Print Zine (Ctrl+P)" aria-keyshortcuts="Control+P">
                        <span class="material-symbols-outlined" aria-hidden="true">print</span>
                        PRINT IT
                    </button>
                </div>
            </div>

            <!-- Right Column: Preview Area -->
            <div id="preview-area"
                class="opacity-50 pointer-events-none transition-opacity duration-500 min-h-[400px] flex flex-col items-center">
                <div class="w-full text-center md:text-left mb-8 flex justify-center md:justify-start">
                    <h2 class="text-2xl font-display font-black uppercase text-white tracking-widest pb-1 border-b-2 border-secondary-cyan drop-shadow-[0_0_8px_rgba(0,255,255,0.4)] inline-block">
                        Preview
                    </h2>
                    <p class="text-xs font-semibold mt-2 text-gray-400 max-w-md hidden" id="preview-description">
                        Laying out your zine...
                    </p>
                </div>

                <!-- Unified Zine View -->
                <div id="zine-sheets-container" class="w-full space-y-12 pb-12">
                    <!-- Sheets will be injected here -->
                </div>

                <div id="zine-container-legacy" class="hidden"></div>

            </div>
        </main>

        <!-- Unused Pages Bucket -->
        <div id="unused-pages-section" class="w-full mt-12 mb-8 hidden">
            <div class="glass-panel p-6 rounded-2xl border-t border-white/10 relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-primary-vibrant/5 to-transparent pointer-events-none"></div>
                
                <div class="flex flex-col sm:flex-row items-center gap-4 mb-6 relative z-10">
                    <h3 class="text-xl font-display font-bold uppercase text-white tracking-widest flex items-center gap-2">
                        <span class="material-symbols-outlined text-gray-400">inventory_2</span>
                        Spare Parts
                    </h3>
                    <span class="text-xs font-bold bg-primary-vibrant/20 text-white px-3 py-1.5 rounded-full border border-primary-vibrant/50 shadow-[0_0_10px_rgba(255,0,255,0.3)]">
                        DRAG TO SWAP
                    </span>
                </div>

                <div id="unused-grid"
                    class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4 min-h-[120px] relative z-10">
                    <!-- Unused pages injected here -->
                </div>
            </div>
        </div>

        <footer class="mt-12 text-center pb-8">
            <p class="text-xs font-medium text-gray-500 uppercase tracking-widest inline-block px-4 py-2 glass-panel rounded-full relative group hover:text-white transition-colors duration-300">
                <span class="absolute inset-0 bg-gradient-to-r from-primary-vibrant/20 to-secondary-cyan/20 blur opacity-0 group-hover:opacity-100 transition-opacity duration-500 rounded-full"></span>
                ZINE-IFY STUDIO
            </p>
        </footer>
    </div>

    <!-- Progress Overlay -->
    <div id="progress-container"
        class="fixed inset-0 bg-neutral-bg/80 z-[100] flex flex-col items-center justify-center p-6 hidden backdrop-blur-xl"
        role="dialog" aria-modal="true" aria-label="Processing">
        <div class="glass-panel p-10 w-full max-w-sm text-center relative overflow-hidden flex flex-col items-center animate-pulse-glow border-primary-vibrant/30 border">
            <div class="absolute inset-0 bg-gradient-to-br from-primary-vibrant/10 to-transparent"></div>
            
            <h3 id="progress-text" class="text-2xl font-display font-black mb-6 uppercase text-white tracking-widest relative z-10" aria-live="polite" aria-atomic="true">
                PROCESSING...
            </h3>
            
            <div id="progress-bar-wrap" class="progress-bar-container mb-6 relative z-10" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progress-fill"></div>
            </div>
            
            <p id="progress-subtext" class="text-xs font-semibold uppercase text-gray-400 relative z-10 tracking-widest" aria-live="polite" aria-atomic="true">
                Engaging Hyperspace Drive
            </p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[300] space-y-4 font-sans" aria-live="polite" aria-atomic="true" role="region" aria-label="Notifications"></div>

    <script type="module" src="/src/js/main.js"></script>

</body>

</html>
