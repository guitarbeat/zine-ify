                        Add PDFs to zine</p>
                    <input type="file" id="pdf-upload" class="hidden" accept="application/pdf" multiple>
                </div>

                <!-- Uploaded Files List -->
                <div id="uploaded-files-list" class="mt-4">
                    <p class="text-xs text-gray-600">No files uploaded yet</p>
                </div>

                <div id="settings-group" class="bg-white p-4 md:p-6 settings-panel space-y-4 md:space-y-5">
                    <h3 class="text-lg font-marker uppercase border-b-2 border-black pb-2 mb-2 transform -rotate-1">

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="paper-size-select" class="text-[10px] font-bold uppercase bg-black text-white inline-block px-1 mb-1">Paper</label>
                            <select id="paper-size-select" class="w-full bg-white font-typewriter text-sm p-1.5 border-2 border-black focus:outline-none focus:ring-0">

                            </select>
                        </div>

                            <select id="orientation-select" class="w-full bg-white font-typewriter text-sm p-1.5 border-2 border-black focus:outline-none focus:ring-0">
                                <option value="landscape">LANDSCAPE</option>
                                <option value="portrait">PORTRAIT</option>
                            </select>
                        </div>
                    </div>

                            <span class="text-xl font-marker" aria-hidden="true">X</span>

                        <button id="printBtn"

                <div id="zine-container-legacy" class="hidden"></div>

        <!-- Unused Pages Bucket -->
        <div id="unused-pages-section" class="w-full max-w-4xl mx-auto mt-12 px-6 pb-4 hidden">

            </div>

            <div id="zine-3d-container" class="flex-1 w-full bg-black rounded-lg border border-white/20 overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.8)] relative">
                <!-- 3D Canvas goes here -->
            </div>

            <div class="mt-6 bg-white/10 backdrop-blur-md p-4 flex flex-col sm:flex-row items-center gap-4 sm:gap-6 rounded-xl border border-white/20">
